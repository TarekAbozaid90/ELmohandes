<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <title>مركز المهندس الشامل | روابط التواصل السريع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-dark: #081c38;
      --navy-mid: #0f2e59;
      --accent-red: #b91c1c;
      --page-bg: #f4f6f9;
      --card-bg: #ffffff;
      --card-border: #e5e9f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--page-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      min-height: 100vh;
      box-shadow: 0 10px 30px rgba(8, 28, 56, 0.08);
      display: flex;
      flex-direction: column;
    }
    .hero {
      background: linear-gradient(165deg, var(--navy-mid) 0%, var(--navy-dark) 100%);
      color: #ffffff;
      padding: 36px 20px 32px;
      text-align: center;
      border-bottom: 4px solid var(--accent-red);
      border-radius: 0 0 28px 28px;
    }
    .logo-wrap {
      width: 112px;
      height: 112px;
      margin: 0 auto 16px;
      background: #ffffff;
      border-radius: 24px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
    }
    .hero h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: 400;
    }
    .links-list {
      padding: 24px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      background-color: var(--page-bg);
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .link-card:active, .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--navy-mid);
    }
    .card-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }
    .card-text strong {
      display: block;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--navy-dark);
    }
    .card-text span {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      direction: ltr;
      text-align: right;
    }
    .chevron {
      color: var(--text-muted);
      font-size: 1.3rem;
      font-weight: 700;
      padding-right: 6px;
    }
    .footer-note {
      text-align: center;
      padding: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: var(--page-bg);
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="logo-wrap">
        <img id="brand-logo" src="/logo.png" alt="شعار مركز المهندس الشامل" />
      </div>
      <h1 id="brand-name">مركز المهندس الشامل</h1>
      <p id="brand-tagline">كل وسائل التواصل والخدمات في مكان واحد</p>
    </header>
    <section id="links-container" class="links-list" aria-label="روابط التواصل"></section>
    <footer class="footer-note">مركز المهندس الشامل — تواصل سريع</footer>
  </main>

  <script>
    async function loadLinks() {
      try {
        const res = await fetch('/links.json?v=' + Date.now());
        if (!res.ok) throw new Error('Failed to load links');
        const data = await res.json();

        document.getElementById('brand-name').textContent = data.brandName;
        document.getElementById('brand-tagline').textContent = data.tagline;
        if (data.logoPath) document.getElementById('brand-logo').src = data.logoPath;

        if (data.theme) {
          const r = document.documentElement.style;
          if (data.theme.navyDark) r.setProperty('--navy-dark', data.theme.navyDark);
          if (data.theme.navyMid) r.setProperty('--navy-mid', data.theme.navyMid);
          if (data.theme.accentRed) r.setProperty('--accent-red', data.theme.accentRed);
          if (data.theme.pageBg) r.setProperty('--page-bg', data.theme.pageBg);
        }

        const container = document.getElementById('links-container');
        container.innerHTML = '';
        data.links.forEach(item => {
          const a = document.createElement('a');
          a.className = 'link-card';
          a.href = item.url;
          a.rel = 'noopener noreferrer';

          const right = document.createElement('div');
          right.className = 'card-right';

          const icon = document.createElement('div');
          icon.className = 'icon-box';
          icon.textContent = item.icon || '🔗';

          const textWrap = document.createElement('div');
          textWrap.className = 'card-text';
          const title = document.createElement('strong');
          title.textContent = item.label;
          const sub = document.createElement('span');
          sub.textContent = item.sublabel || '';
          textWrap.append(title, sub);

          right.append(icon, textWrap);

          const chev = document.createElement('span');
          chev.className = 'chevron';
          chev.textContent = '‹';

          a.append(right, chev);
          container.appendChild(a);
        });
      } catch (err) {
        document.getElementById('links-container').innerHTML =
          '<p style="text-align:center;color:#b91c1c;">تعذر تحميل الروابط حالياً، يرجى المحاولة مجدداً.</p>';
      }
    }
    loadLinks();
  </script>
</body>
</html>
