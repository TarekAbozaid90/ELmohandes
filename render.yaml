# Render Blueprint — يجبر المشروع على Node.js (يحل مشكلة Ruby/Gemfile)
services:
  - type: web
    name: ElMohandes
    runtime: node
    branch: main
    plan: starter
    buildCommand: ""
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SEED_DEMO
        value: "1"
    disk:
      name: mohandis-data
      mountPath: /var/data
      sizeGB: 1
const path = require('path');

app.use(express.static(path.join(__dirname, 'public')));

app.get('/qr', (req, res) => {
  res.sendFile(path.join(__dirname, 'public', 'qr.html'));
});

app.get('/health', (req, res) => {
  res.status(200).send('OK');
});
